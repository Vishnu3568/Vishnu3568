<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0D1117; }
      .month-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #8B949E; }
      .cell-empty { fill: #161B22; rx: 2px; }
      .cell-l1 { fill: #0e4429; rx: 2px; }
      .cell-l2 { fill: #006d32; rx: 2px; }
      .cell-l3 { fill: #26a641; rx: 2px; }
      .cell-l4 { fill: #39d353; rx: 2px; }
      
      @keyframes walk1 {
        0%, 100% { transform: translate(440px, 28px); }
        50% { transform: translate(520px, 28px); }
      }
      @keyframes walk2 {
        0%, 100% { transform: translate(780px, 95px); }
        50% { transform: translate(710px, 95px); }
      }
      @keyframes bombBlast1 {
        0%, 40% { opacity: 0; transform: scale(0.2); }
        45% { opacity: 1; transform: scale(1); }
        60% { opacity: 0.9; transform: scale(1.1); }
        70%, 100% { opacity: 0; transform: scale(0.1); }
      }
      @keyframes bombBlast2 {
        0%, 30% { opacity: 0; transform: scale(0.1); }
        35% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.1); }
        60%, 100% { opacity: 0; transform: scale(0.1); }
      }
      @keyframes blastGlow {
        0%, 100% { filter: drop-shadow(0 0 2px #FF5500); }
        50% { filter: drop-shadow(0 0 8px #FFEE00); }
      }

      .bomber1 { animation: walk1 6s infinite ease-in-out; }
      .bomber2 { animation: walk2 7s infinite ease-in-out; }
      .blast1 { transform-origin: 480px 52px; animation: bombBlast1 4s infinite ease-out, blastGlow 0.5s infinite; }
      .blast2 { transform-origin: 740px 110px; animation: bombBlast2 5s infinite ease-out, blastGlow 0.5s infinite; }
    </style>

    <!-- Fire Blast Gradient -->
    <radialGradient id="fireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFDD33" />
      <stop offset="70%" stop-color="#FF4400" />
      <stop offset="100%" stop-color="#880000" opacity="0.1" />
    </radialGradient>
  </defs>

  <rect width="920" height="180" rx="6" class="bg" />

  <!-- Month Labels -->
  <g class="month-label">
    <text x="35" y="24">Aug</text>
    <text x="100" y="24">Sep</text>
    <text x="170" y="24">Oct</text>
    <text x="240" y="24">Nov</text>
    <text x="315" y="24">Dec</text>
    <text x="390" y="24">Jan</text>
    <text x="460" y="24">Feb</text>
    <text x="530" y="24">Mar</text>
    <text x="600" y="24">Apr</text>
    <text x="670" y="24">May</text>
    <text x="740" y="24">Jun</text>
    <text x="810" y="24">Jul</text>
    <text x="875" y="24">Aug</text>
  </g>

  <!-- Grid Contribution Background (52 columns x 7 rows pattern) -->
  <g transform="translate(30, 36)">
    <!-- Base grid dots -->
    <g>
      <!-- Repeating Columns with various contribution levels -->
      <rect x="0" y="0" width="13" height="13" class="cell-l3" />
      <rect x="0" y="16" width="13" height="13" class="cell-l4" />
      <rect x="0" y="32" width="13" height="13" class="cell-l2" />
      <rect x="0" y="48" width="13" height="13" class="cell-l4" />
      <rect x="0" y="64" width="13" height="13" class="cell-l3" />
      <rect x="0" y="80" width="13" height="13" class="cell-empty" />
      <rect x="0" y="96" width="13" height="13" class="cell-empty" />

      <rect x="16" y="0" width="13" height="13" class="cell-empty" />
      <rect x="16" y="16" width="13" height="13" class="cell-l1" />
      <rect x="16" y="32" width="13" height="13" class="cell-l3" />
      <rect x="16" y="48" width="13" height="13" class="cell-l2" />
      <rect x="16" y="64" width="13" height="13" class="cell-l4" />
      <rect x="16" y="80" width="13" height="13" class="cell-l2" />
      <rect x="16" y="96" width="13" height="13" class="cell-empty" />

      <rect x="32" y="0" width="13" height="13" class="cell-l2" />
      <rect x="32" y="16" width="13" height="13" class="cell-l4" />
      <rect x="32" y="32" width="13" height="13" class="cell-l3" />
      <rect x="32" y="48" width="13" height="13" class="cell-l4" />
      <rect x="32" y="64" width="13" height="13" class="cell-l3" />
      <rect x="32" y="80" width="13" height="13" class="cell-l1" />
      <rect x="32" y="96" width="13" height="13" class="cell-empty" />

      <rect x="48" y="0" width="13" height="13" class="cell-empty" /><rect x="48" y="16" width="13" height="13" class="cell-empty" /><rect x="48" y="32" width="13" height="13" class="cell-l1" /><rect x="48" y="48" width="13" height="13" class="cell-l3" /><rect x="48" y="64" width="13" height="13" class="cell-empty" /><rect x="48" y="80" width="13" height="13" class="cell-empty" /><rect x="48" y="96" width="13" height="13" class="cell-empty" />
      
      <!-- Middle blocks -->
      <rect x="230" y="48" width="13" height="13" class="cell-l1" />

      <!-- Active clusters in Spring -->
      <rect x="360" y="32" width="13" height="13" class="cell-l3" /><rect x="360" y="48" width="13" height="13" class="cell-l2" /><rect x="360" y="64" width="13" height="13" class="cell-l4" /><rect x="360" y="80" width="13" height="13" class="cell-l2" />
      <rect x="376" y="32" width="13" height="13" class="cell-l4" /><rect x="376" y="48" width="13" height="13" class="cell-l3" /><rect x="376" y="64" width="13" height="13" class="cell-l4" /><rect x="376" y="80" width="13" height="13" class="cell-l3" />
      <rect x="392" y="32" width="13" height="13" class="cell-l2" /><rect x="392" y="48" width="13" height="13" class="cell-l4" /><rect x="392" y="64" width="13" height="13" class="cell-l2" /><rect x="392" y="80" width="13" height="13" class="cell-l4" />
      <rect x="408" y="16" width="13" height="13" class="cell-l1" /><rect x="408" y="32" width="13" height="13" class="cell-l3" /><rect x="408" y="48" width="13" height="13" class="cell-l2" /><rect x="408" y="64" width="13" height="13" class="cell-l3" />
      <rect x="424" y="32" width="13" height="13" class="cell-l4" /><rect x="424" y="48" width="13" height="13" class="cell-l4" /><rect x="424" y="64" width="13" height="13" class="cell-l2" /><rect x="424" y="80" width="13" height="13" class="cell-l3" />
      <rect x="440" y="0" width="13" height="13" class="cell-l2" /><rect x="440" y="32" width="13" height="13" class="cell-l3" /><rect x="440" y="48" width="13" height="13" class="cell-l4" /><rect x="440" y="64" width="13" height="13" class="cell-l1" />

      <!-- Summer Clusters -->
      <rect x="620" y="0" width="13" height="13" class="cell-l3" /><rect x="620" y="16" width="13" height="13" class="cell-l2" /><rect x="620" y="32" width="13" height="13" class="cell-l4" /><rect x="620" y="48" width="13" height="13" class="cell-l3" /><rect x="620" y="64" width="13" height="13" class="cell-l4" />
      <rect x="636" y="0" width="13" height="13" class="cell-l4" /><rect x="636" y="16" width="13" height="13" class="cell-l3" /><rect x="636" y="32" width="13" height="13" class="cell-l4" /><rect x="636" y="48" width="13" height="13" class="cell-l2" /><rect x="636" y="64" width="13" height="13" class="cell-l3" />
      <rect x="652" y="16" width="13" height="13" class="cell-l4" /><rect x="652" y="32" width="13" height="13" class="cell-l2" /><rect x="652" y="48" width="13" height="13" class="cell-l3" /><rect x="652" y="64" width="13" height="13" class="cell-l4" /><rect x="652" y="80" width="13" height="13" class="cell-l2" />
      <rect x="668" y="0" width="13" height="13" class="cell-l2" /><rect x="668" y="16" width="13" height="13" class="cell-l4" /><rect x="668" y="32" width="13" height="13" class="cell-l3" /><rect x="668" y="48" width="13" height="13" class="cell-l4" />
      <rect x="684" y="0" width="13" height="13" class="cell-l3" /><rect x="684" y="16" width="13" height="13" class="cell-l2" /><rect x="684" y="48" width="13" height="13" class="cell-l3" /><rect x="684" y="64" width="13" height="13" class="cell-l2" />
      <rect x="700" y="32" width="13" height="13" class="cell-l4" /><rect x="700" y="48" width="13" height="13" class="cell-l2" /><rect x="700" y="64" width="13" height="13" class="cell-l3" />
      <rect x="760" y="16" width="13" height="13" class="cell-l3" /><rect x="760" y="32" width="13" height="13" class="cell-l4" /><rect x="760" y="48" width="13" height="13" class="cell-l2" /><rect x="760" y="64" width="13" height="13" class="cell-l3" />
      <rect x="810" y="32" width="13" height="13" class="cell-l3" /><rect x="810" y="48" width="13" height="13" class="cell-l4" />
    </g>
  </g>

  <!-- Animated Cross Explosions -->
  <!-- Blast 1 (Around March) -->
  <g class="blast1">
    <!-- Horizontal fire bar -->
    <rect x="420" y="47" width="115" height="10" rx="4" fill="url(#fireGrad)" />
    <!-- Vertical fire bar -->
    <rect x="472" y="-5" width="10" height="115" rx="4" fill="url(#fireGrad)" />
    <circle cx="477" cy="52" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Blast 2 (Around June/July) -->
  <g class="blast2">
    <!-- Horizontal fire bar -->
    <rect x="685" y="105" width="115" height="10" rx="4" fill="url(#fireGrad)" />
    <!-- Vertical fire bar -->
    <rect x="737" y="52" width="10" height="115" rx="4" fill="url(#fireGrad)" />
    <circle cx="742" cy="110" r="14" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Pixel Art Bomberman Characters -->
  <!-- White Bomberman -->
  <g class="bomber1">
    <!-- Head/Helmet -->
    <rect x="0" y="0" width="16" height="15" rx="3" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
    <!-- Face visor -->
    <rect x="3" y="4" width="10" height="6" rx="2" fill="#FFCCAA" />
    <rect x="5" y="5" width="2" height="3" fill="#000000" />
    <rect x="9" y="5" width="2" height="3" fill="#000000" />
    <!-- Pink Antenna Ball -->
    <circle cx="8" cy="-4" r="3.5" fill="#FF3388" stroke="#000000" stroke-width="1" />
    <rect x="7" y="-1" width="2" height="2" fill="#000000" />
    <!-- Body -->
    <rect x="2" y="15" width="12" height="8" rx="2" fill="#0066CC" stroke="#000000" stroke-width="1" />
    <!-- Belt -->
    <rect x="2" y="18" width="12" height="2" fill="#FFCC00" />
    <!-- Pink Hands / Feet -->
    <circle cx="0" cy="19" r="2.5" fill="#FF3388" />
    <circle cx="16" cy="19" r="2.5" fill="#FF3388" />
    <rect x="2" y="23" width="4" height="4" fill="#FF3388" />
    <rect x="10" y="23" width="4" height="4" fill="#FF3388" />
  </g>

  <!-- Black/Purple Bomberman -->
  <g class="bomber2">
    <!-- Head/Helmet -->
    <rect x="0" y="0" width="16" height="15" rx="3" fill="#331144" stroke="#A970FF" stroke-width="1.5" />
    <!-- Face visor -->
    <rect x="3" y="4" width="10" height="6" rx="2" fill="#FFBBAA" />
    <rect x="5" y="5" width="2" height="3" fill="#000000" />
    <rect x="9" y="5" width="2" height="3" fill="#000000" />
    <!-- Red Antenna Ball -->
    <circle cx="8" cy="-4" r="3.5" fill="#FF2244" stroke="#000000" stroke-width="1" />
    <rect x="7" y="-1" width="2" height="2" fill="#000000" />
    <!-- Body -->
    <rect x="2" y="15" width="12" height="8" rx="2" fill="#220033" stroke="#A970FF" stroke-width="1" />
    <!-- Belt -->
    <rect x="2" y="18" width="12" height="2" fill="#00F2FE" />
    <!-- Red Hands / Feet -->
    <circle cx="0" cy="19" r="2.5" fill="#FF2244" />
    <circle cx="16" cy="19" r="2.5" fill="#FF2244" />
    <rect x="2" y="23" width="4" height="4" fill="#FF2244" />
    <rect x="10" y="23" width="4" height="4" fill="#FF2244" />
  </g>
</svg>
