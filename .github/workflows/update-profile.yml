name: Update Profile README

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'profile-3d-contrib/**'
      - 'assets/**'
      - 'README.md'

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update GitHub Streak Stats
        run: node scripts/update-streak.js

      - name: Update Contribution Graph
        run: node scripts/update-graph.js

      - name: Generate 3D Contribution Graph
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md profile-3d-contrib/ assets/streak_stats.svg assets/contribution_graph.svg
          if git diff --staged --quiet; then
            echo "No changes in contribution graphs or streak stats."
            exit 0
          fi

          git commit -m "docs: auto-update contribution graphs & streak stats [skip ci]"

          # Retry push in case main advanced while this workflow was running.
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Changes pushed successfully."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep 2
          done

          echo "Unable to push changes after retries."
          exit 1
